<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario familiar</title><style>
:root{--p:#6b4eb1;--sof:#d81b60;--nico:#1976d2;--r:#0d47a1;--a:#ef6c00;--bad:#d50000}*{box-sizing:border-box}body{margin:0;background:#f5f3f8;font:14px system-ui;color:#282531;padding-bottom:68px}button,input{font:inherit}header{position:sticky;top:0;z-index:5;background:white;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid #ddd}header b{min-width:190px;text-align:center;text-transform:capitalize}.btn{border:0;border-radius:10px;padding:8px 11px;font-weight:800;background:#eeeaf7}.datepick{width:42px}.screen{display:none;padding:10px;max-width:1000px;margin:auto}.screen.on{display:block}.week{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:7px;overflow-x:auto}.day{background:#fff;border-radius:14px;padding:8px;min-height:480px}.day h3{margin:0 0 8px;display:flex;justify-content:space-between}.event{background:#faf9fc;border-left:5px solid #888;border-radius:10px;padding:7px;margin:7px 0}.event.pending{border-color:var(--bad);background:#fff1f1}.who{font-weight:1000}.sofi{color:var(--sof)}.nico{color:var(--nico)}.r{color:var(--r)}.a{color:var(--a)}.time{font-weight:800;margin:3px 0}.trip{font-weight:800;line-height:1.25}.q{font-size:25px;color:var(--bad);line-height:.8}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mday{background:white;border-radius:9px;min-height:100px;padding:5px}.mini{font-size:10px;background:#f0edf5;border-left:3px solid #888;border-radius:4px;margin-top:3px;padding:3px;overflow:hidden}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ddd}.bottom button{border:0;background:white;padding:11px}.bottom .on{color:var(--p);font-weight:900}.fab{position:fixed;right:16px;bottom:76px;border:0;border-radius:50%;width:54px;height:54px;background:var(--p);color:white;font-size:28px}dialog{border:0;border-radius:18px;width:min(95vw,560px);max-height:92vh}label{display:block;font-weight:800;margin-top:9px}.choices{display:flex;gap:6px;flex-wrap:wrap}.choice{border:2px solid #ddd;border-radius:999px;background:white;padding:7px 10px;font-weight:800}.choice.sel{border-color:var(--p);background:#eee8ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input{width:100%;padding:9px;border:1px solid #ccc;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.hidden{display:none}.holiday{background:#ffdede;padding:4px;border-radius:5px;font-weight:800}.school{background:#ddf1ff;padding:4px;border-radius:5px;font-weight:800}.vac{background:#ddf5e3;padding:4px;border-radius:5px;font-weight:900}@media(max-width:650px){.week{grid-template-columns:repeat(7,84vw)}.day{min-height:65vh}.mday{min-height:82px}}
</style></head><body><header><button id="prev" class="btn">‹</button><b id="period"></b><button id="today" class="btn">Hoy</button><input id="jump" class="btn datepick" type="date"><button id="next" class="btn">›</button></header><main><section id="week" class="screen on"></section><section id="month" class="screen"></section><section id="day" class="screen"></section><section id="pending" class="screen"></section></main><button id="add" class="fab">+</button><nav class="bottom"><button data-s="week" class="on">📅 Semana</button><button data-s="month">🗓️ Mes</button><button data-s="day">📆 Día</button><button data-s="pending">❓ Pendientes</button></nav>
<dialog id="dlg"><form id="form"><h2 id="ft">Nueva actividad</h2><input id="eid" type="hidden"><label>Quién</label><div id="person" class="choices"><button type="button" class="choice sofi sel" data-v="SOFI">SOFI</button><button type="button" class="choice nico" data-v="NICO">NICO</button><button type="button" class="choice r" data-v="R">R</button><button type="button" class="choice a" data-v="A">A</button><button type="button" class="choice" data-v="FAMILIA">FAMILIA</button></div><label>Actividad</label><div id="act" class="choices"></div><div id="other" class="hidden"><label>Leyenda</label><input id="legend"></div><div id="birthday" class="hidden"><label>¿De quién es el cumpleaños?</label><input id="bwho" placeholder="Ej. FU"></div><div class="grid"><div><label>Fecha</label><input id="date" type="date" required></div><div><label>Hasta</label><input id="until" type="date" required></div><div><label>Empieza</label><input id="start" type="time"></div><div><label>Termina</label><input id="end" type="time"></div></div><div id="transport"><label>Lleva / va</label><div id="takes" class="choices"></div><label>Recoge / vuelve</label><div id="picks" class="choices"></div></div><label>Repetición</label><div id="repeat" class="choices"><button type="button" class="choice sel" data-v="none">No</button><button type="button" class="choice" data-v="weekly">Semanal</button></div><label>Estado</label><div id="status" class="choices"><button type="button" class="choice sel" data-v="active">Activa</button><button type="button" class="choice" data-v="cancelled">⊘ Cancelada</button></div><div class="actions"><button type="button" id="del" class="btn hidden">Eliminar</button><button type="button" id="close" class="btn">Cerrar</button><button class="btn" style="background:var(--p);color:white">Guardar</button></div></form></dialog>
<script>
const A=[['⚽','Entrenamiento fútbol'],['🤸','Fitkids'],['🧠','Terapia'],['🧠','Psicólogo'],['✂️','Peluquería'],['🏫','Recoger cole'],['🎸','Guitarra'],['🏆','Partido de fútbol'],['🎂','Cumpleaños'],['👵','Abuelos'],['⛺','Campamento'],['⭐','Otra']];const M=['R','A','ABU','Solo','Bus','No aplica','❓'];const COL={SOFI:'#d81b60',NICO:'#1976d2',R:'#0d47a1',A:'#ef6c00',FAMILIA:'#6750a4'};const SCHOOL=[['2026-12-23','2027-01-10','Vacaciones escolares'],['2027-03-22','2027-03-28','Vacaciones escolares'],['2026-10-30','2026-10-30','No lectivo'],['2026-11-03','2026-11-04','No lectivo'],['2027-02-08','2027-02-09','No lectivo'],['2027-04-30','2027-04-30','No lectivo'],['2027-05-03','2027-05-03','No lectivo']];const HOL={'2026-10-12':'Festivo nacional','2026-12-08':'Festivo nacional','2026-12-25':'Navidad'};
const seed=[['09-07','SOFI','Fitkids','🤸','18:30'],['09-09','SOFI','Terapia','🧠','16:00'],['09-09','NICO','Salida fútbol','⚽','18:00'],['09-09','SOFI','Fitkids','🤸','18:30'],['09-10','NICO','Fútbol CAO','⚽','17:45'],['09-10','SOFI','C2 psicólogo','🧠','18:00'],['09-11','NICO','Salida fútbol','⚽','18:00'],['09-11','NICO','Peluquería','✂️','19:30'],['09-13','FAMILIA','Cumpleaños FU','🎂',''],['09-14','SOFI','Fitkids','🤸','18:30'],['09-15','SOFI','Terapia','🧠','17:45'],['09-15','NICO','Fútbol CAO','⚽','17:45'],['09-16','SOFI','Terapia','🧠','16:00'],['09-16','NICO','Salida fútbol','⚽','18:00'],['09-16','SOFI','Fitkids','🤸','18:30'],['09-17','NICO','Fútbol CAO','⚽','17:45'],['09-18','NICO','Salida fútbol','⚽','18:00'],['09-21','SOFI','Fitkids','🤸','18:30'],['09-22','SOFI','Terapia','🧠','17:45'],['09-22','NICO','Fútbol CAO','⚽','17:45'],['09-23','SOFI','Terapia','🧠','16:00'],['09-23','NICO','Salida fútbol','⚽','18:00'],['09-23','SOFI','Fitkids','🤸','18:30'],['09-24','NICO','Fútbol CAO','⚽','17:45'],['09-25','NICO','Salida fútbol','⚽','18:00'],['09-28','SOFI','Fitkids','🤸','18:30'],['09-29','SOFI','Terapia','🧠','17:45'],['09-29','NICO','Fútbol CAO','⚽','17:45'],['09-30','SOFI','Terapia','🧠','16:00'],['09-30','NICO','Salida fútbol','⚽','18:00'],['09-30','SOFI','Fitkids','🤸','18:30'],['10-01','NICO','Fútbol CAO','⚽','17:45']].map((x,i)=>({id:'demo'+i,date:'2026-'+x[0],until:'2026-'+x[0],person:x[1],name:x[2],icon:x[3],start:x[4],end:'',takes:x[1]==='FAMILIA'?'No aplica':'❓',picks:x[1]==='FAMILIA'?'No aplica':'❓',repeat:'none',status:'active',birthdayWho:x[2].includes('FU')?'FU':''}));let ev=JSON.parse(localStorage.getItem('familyDemoV8')||'null')||seed;localStorage.setItem('familyDemoV8',JSON.stringify(ev));let anchor=new Date('2026-09-07T12:00'),screen='week';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},parse=s=>new Date(s+'T12:00'),add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},mon=d=>add(d,-((d.getDay()+6)%7));
function occ(a,b){let o=[];for(const e of ev){if(e.repeat==='weekly'){for(let d=parse(e.date);d<=b&&iso(d)<=e.until;d=add(d,7))if(d>=a)o.push({...e,on:iso(d)})}else{let d=parse(e.date);if(d>=a&&d<=b)o.push({...e,on:e.date})}}return o.sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'))}function cls(p){return p==='SOFI'?'sofi':p==='NICO'?'nico':p==='R'?'r':p==='A'?'a':''}function time(e){return e.start+(e.end?'–'+e.end:'')}function trip(v,i){return v==='❓'?`<div class="trip"><b class="q">❓</b>${i}</div>`:v==='No aplica'?`<div class="trip">— ${i}</div>`:`<div class="trip"><b class="${cls(v)}">${v}</b> ${i}</div>`}function card(e,mini=false){let adult=['R','A','FAMILIA'].includes(e.person),p=!adult&&(e.takes==='❓'||e.picks==='❓');if(mini)return `<div class="mini" data-id="${e.id}"><b class="${cls(e.person)}">${e.person}</b> ${e.icon} ${e.name} ${time(e)}</div>`;return `<div class="event ${p?'pending':''}" data-id="${e.id}" style="border-color:${COL[e.person]}"><b class="who ${cls(e.person)}">${e.person}</b> ${e.icon} <b>${e.name}</b><div class="time">${time(e)}</div>${adult?'':trip(e.takes,'🚗')+trip(e.picks,'🏠')}</div>`}function bands(ds){let s=SCHOOL.find(x=>ds>=x[0]&&ds<=x[1]);return `${HOL[ds]?`<div class="holiday">${HOL[ds]}</div>`:''}${s?`<div class="school">${s[2]}</div>${s[2].includes('Vacaciones')?'<div class="vac">🏖️ NICO · SOFI</div>':''}`:''}`}
function render(){let m=mon(anchor),z=add(m,6),w=occ(m,z);$('#period').textContent=screen==='month'?anchor.toLocaleDateString('es-ES',{month:'long',year:'numeric'}):screen==='day'?anchor.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}):`${m.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${z.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;$('#week').innerHTML=`<div class="week">${[0,1,2,3,4,5,6].map(i=>{let d=add(m,i),ds=iso(d),x=w.filter(e=>e.on===ds);return `<div class="day"><h3><span data-day="${ds}">${d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'})} ${x.length?`(${x.length})`:''}</span><button class="btn" data-add="${ds}">+</button></h3>${bands(ds)}${x.map(e=>card(e)).join('')||'Sin actividades'}</div>`}).join('')}</div>`;let f=new Date(anchor.getFullYear(),anchor.getMonth(),1,12),g=add(f,-((f.getDay()+6)%7)),mo=occ(g,add(g,41));$('#month').innerHTML=`<div class="month">${['L','M','X','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${[...Array(42)].map((_,i)=>{let d=add(g,i),ds=iso(d),x=mo.filter(e=>e.on===ds);return `<div class="mday" data-day="${ds}"><b>${d.getDate()}</b>${bands(ds)}${x.map(e=>card(e,true)).join('')}</div>`}).join('')}</div>`;let ds=iso(anchor),de=occ(parse(ds),parse(ds));$('#day').innerHTML=`<h2>${anchor.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</h2>${bands(ds)}${de.map(e=>card(e)).join('')||'Sin actividades'}`;let pe=occ(new Date(),add(new Date(),30)).filter(e=>!['R','A','FAMILIA'].includes(e.person)&&(e.takes==='❓'||e.picks==='❓'));$('#pending').innerHTML='<h2>Pendientes</h2>'+pe.map(e=>card(e)).join('');bind()}
function bind(){$$('[data-day]').forEach(x=>x.onclick=()=>{anchor=parse(x.dataset.day);go('day')});$$('[data-add]').forEach(x=>x.onclick=e=>{e.stopPropagation();open(x.dataset.add)});$$('.event').forEach(x=>x.onclick=()=>open(null,ev.find(e=>e.id===x.dataset.id)))}function go(s){screen=s;$$('.screen').forEach(x=>x.classList.toggle('on',x.id===s));$$('.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.s===s));render()}function pick(id,v){$$('#'+id+' .choice').forEach(x=>x.classList.toggle('sel',x.dataset.v===v))}function val(id){return $('#'+id+' .sel')?.dataset.v}
function open(d=iso(anchor),e=null){$('#form').reset();$('#eid').value=e?.id||'';pick('person',e?.person||'SOFI');let base=A.some(x=>x[1]===e?.name)?e.name:e?.name?.startsWith('Cumpleaños')?'Cumpleaños':'Otra';pick('act',base||'Entrenamiento fútbol');pick('takes',e?.takes||'❓');pick('picks',e?.picks||'❓');pick('repeat',e?.repeat||'none');pick('status',e?.status||'active');$('#date').value=e?.date||d;$('#until').value=e?.until||d;$('#start').value=e?.start||'';$('#end').value=e?.end||'';$('#legend').value=base==='Otra'?e?.name||'':'';$('#bwho').value=e?.birthdayWho||'';$('#del').classList.toggle('hidden',!e);toggle();$('#dlg').showModal()}function toggle(){let a=val('act');$('#other').classList.toggle('hidden',a!=='Otra');$('#birthday').classList.toggle('hidden',a!=='Cumpleaños');$('#transport').classList.toggle('hidden',['R','A','FAMILIA'].includes(val('person')))}
$('#act').innerHTML=A.map(([i,n])=>`<button type="button" class="choice ${n==='Entrenamiento fútbol'?'sel':''}" data-v="${n}" data-i="${i}">${i} ${n}</button>`).join('');for(const id of ['takes','picks'])$('#'+id).innerHTML=M.map(v=>`<button type="button" class="choice ${v==='❓'?'sel':''}" data-v="${v}">${v}</button>`).join('');$$('.choices').forEach(g=>g.onclick=e=>{let b=e.target.closest('.choice');if(!b)return;g.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');toggle()});$$('.bottom button').forEach(x=>x.onclick=()=>go(x.dataset.s));$('#prev').onclick=()=>{anchor=add(anchor,screen==='week'?-7:screen==='month'?-30:-1);render()};$('#next').onclick=()=>{anchor=add(anchor,screen==='week'?7:screen==='month'?30:1);render()};$('#today').onclick=()=>{anchor=new Date();go('day')};$('#jump').onchange=()=>{if($('#jump').value){anchor=parse($('#jump').value);go('day')}};$('#add').onclick=()=>open();$('#close').onclick=()=>$('#dlg').close();$('#del').onclick=()=>{ev=ev.filter(x=>x.id!==$('#eid').value);save();$('#dlg').close()};$('#form').onsubmit=e=>{e.preventDefault();let ac=val('act'),name=ac,icon=$(`#act [data-v="${ac}"]`).dataset.i,bw='';if(ac==='Otra'){name=$('#legend').value.trim();if(!name)return alert('Escribe la leyenda')}if(ac==='Cumpleaños'){bw=$('#bwho').value.trim();if(!bw)return alert('Indica de quién es');name='Cumpleaños '+bw}let o={id:$('#eid').value||crypto.randomUUID(),date:$('#date').value,until:$('#until').value,person:val('person'),name,icon,start:$('#start').value,end:$('#end').value,takes:val('takes'),picks:val('picks'),repeat:val('repeat'),status:val('status'),birthdayWho:bw};let i=ev.findIndex(x=>x.id===o.id);i<0?ev.push(o):ev[i]=o;save();$('#dlg').close()};function save(){localStorage.setItem('familyDemoV8',JSON.stringify(ev));render()}render();
</script></body></html>
