s="month">🗓️ Mes</button><button data-s="day">📆 Día</button><button data-s="pending">❓ Pendientes</button></nav> <dialog id="loginDlg"><form id="loginForm" class="login"><h2>Calendario familiar</h2><p>Acceso de Rodrigo y Arancha</p><label>Correo electrónico</label><input id="email" type="email" required autocomplete="username"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"><div id="loginError" class="message hidden"></div><div class="actions"><button class="btn" style="background:var(--p);color:white">Entrar</button></div></form></dialog> <dialog id="dlg"><form id="form"><h2 id="ft">Nueva actividad</h2><input id="eid" type="hidden"><label>Quién</label><div id="person" class="choices"><button type="button" class="choice sofi sel" data-v="SOFI">SOFI</button><button type="button" class="choice nico" data-v="NICO">NICO</button><button type="button" class="choice r" data-v="R">R</button><button type="button" class="choice a" data-v="A">A</button><button type="button" class="choice" data-v="FAMILIA">FAMILIA</button></div><label>Actividad</label><div id="act" class="choices"></div><div id="other" class="hidden"><label>Leyenda</label><input id="legend"></div><div id="birthday" class="hidden"><label>¿De quién es el cumpleaños?</label><input id="bwho" placeholder="Ej. FU"></div><div class="grid"><div><label>Fecha</label><input id="date" type="date" required></div><div><label>Hasta</label><input id="until" type="date" required></div><div><label>Empieza</label><input id="start" type="time"></div><div><label>Termina</label><input id="end" type="time"></div></div><div id="transport"><label>Lleva / va</label><div id="takes" class="choices"></div><label>Recoge / vuelve</label><div id="picks" class="choices"></div></div><label>Repetición</label><div id="repeat" class="choices"><button type="button" class="choice sel" data-v="none">No</button><button type="button" class="choice" data-v="weekly">Semanal</button></div><label>Estad } function appToDb(x){return {id:x.id||undefined,date:x.date,until:x.until,person:x.person,name:x.name,icon:x.icon||'',start:x.start||'',end:x.end||'',takes:x.takes||'No aplica',picks:x.picks||'No aplica',repeat:x.repeat||'none',status:x.status||'active',birthday_who:x.birthdayWho||null}} function setSync(t,bad=false){$('#sync').textContent=t;$('#sync').style.color=bad?'#b00020':'#236b31'} async function cargarEventos(){setSync('Sincronizando…');const {data,error}=await supabaseClient.from('eventos').select('*').order('date').order('start');if(error){setSync('Error de conexión',true);console.error(error);return}ev=(data||[]).map(dbToApp);setSync('✓ Sincronizado');render()} async function guardarEvento(o){let payload=appToDb(o),result;if(o.id)result=await supabaseClient.from('eventos').update(payload).eq('id',o.id);else{delete payload.id;result=await supabaseClient.from('eventos').insert(payload)}if(result.error){alert('No se pudo guardar: '+result.error.message);return false}await cargarEventos();return true} async function eliminarEvento(id){const {error}=await supabaseClient.from('eventos').delete().eq('id',id);if(error){alert('No se pudo eliminar: '+error.message);return}await cargarEventos()} function occ(a,b){let o=[];for(const e of ev){if(e.repeat==='weekly'){for(let d=parse(e.date);d<=b&&iso(d)<=e.until;d=add(d,7))if(d>=a)o.push({...e,on:iso(d)})}else{let d=parse(e.date);if(d>=a&&d<=b)o.push({...e,on:e.date})}}return o.sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'))} function cls(p){return p==='SOFI'?'sofi':p==='NICO'?'nico':p==='R'?'r':p==='A'?'a':''} function time(e){return (e.start||'')+(e.end?'–'+e.end:'')} function trip(v,i){return v==='❓'?`<div class="trip"><b class="q">❓</b>${i}</div>`:v==='No aplica'?`<div class="trip">— ${i}</div>`:`<div class="trip"><b class="${cls(v)}">${v}</b> ${i}</div>`} function card(e,mini=false){let adult=['R','A','FAMILIA'].includes(e.person),p=!adult&&(e.takes==='❓'||e.picks==='❓'),cancel=e.status==='cancelled';if day').innerHTML=`<h2>${anchor.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</h2>${bands(ds)}${de.map(e=>card(e)).join('')||'Sin actividades'}`;let pe=occ(new Date(),add(new Date(),30)).filter(e=>!['R','A','FAMILIA'].includes(e.person)&&(e.takes==='❓'||e.picks==='❓'));$('#pending').innerHTML='<h2>Pendientes</h2>'+pe.map(e=>card(e)).join('');bind()} function bind(){$$('[data-day]').forEach(x=>x.onclick=()=>{anchor=parse(x.dataset.day);go('day')});$$('[data-add]').forEach(x=>x.onclick=e=>{e.stopPropagation();open(x.dataset.add)});$$('.event,.mini').forEach(x=>x.onclick=()=>open(null,ev.find(e=>e.id===x.dataset.id)))} function go(s){screen=s;$$('.screen').forEach(x=>x.classList.toggle('on',x.id===s));$$('.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.s===s));render()} function pick(id,v){$$('#'+id+' .choice').forEach(x=>x.classList.toggle('sel',x.dataset.v===v))} function val(id){return $('#'+id+' .sel')?.dataset.v} function open(d=iso(anchor),e=null){$('#form').reset();$('#eid').value=e?.id||'';pick('person',e?.person||'SOFI');let base=A.some(x=>x[1]===e?.name)?e.name:e?.name?.startsWith('Cumpleaños')?'Cumpleaños':'Otra';pick('act',base||'Entrenamiento fútbol');pick('takes',e?.takes||'❓');pick('picks',e?.picks||'❓');pick('repeat',e?.repeat||'none');pick('status',e?.status||'active');$('#date').value=e?.date||d;$('#until').value=e?.until||d;$('#start').value=e?.start||'';$('#end').value=e?.end||'';$('#legend').value=base==='Otra'?e?.name||'':'';$('#bwho').value=e?.birthdayWho||'';$('#del').classList.toggle('hidden',!e);toggle();$('#dlg').showModal()} function toggle(){let a=val('act');$('#other').classList.toggle('hidden',a!=='Otra');$('#birthday').classList.toggle('hidden',a!=='Cumpleaños');$('#transport').classList.toggle('hidden',['R','A','FAMILIA'].includes(val('person')))} $('#act').innerHTML=A.map(([i,n])=>`<button type="button" class="choice ${n==='Entrenamiento fútbol'?'sel':''}" data-v="${n}" data-i="${i}">${i} ${n}</button>`).join('');for(const id of ['takes','picks'])$('#'+id).innerHTML=M.map(v=>`<button type="button" class="choice ${v==='❓'?'sel':''}" data-v="${v}">${v}</button>`).join(''); $$('.choices').forEach(g=>g.onclick=e=>{let b=e.target.closest('.choice');if(!b)return;g.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');toggle()}); $$('.bottom button').forEach(x=>x.onclick=()=>go(x.dataset.s));$('#prev').onclick=()=>{anchor=add(anchor,screen==='week'?-7:screen==='month'?-30:-1);render()};$('#next').onclick=()=>{anchor=add(anchor,screen==='week'?7:screen==='month'?30:1);render()};$('#today').onclick=()=>{anchor=new Date();go('day')};$('#jump').onchange=()=>{if($('#jump').value){anchor=parse($('#jump').value);go('day')}};$('#add').onclick=()=>open();$('#close').onclick=()=>$('#dlg').close(); $('#del').onclick=async()=>{let id=$('#eid').value;if(id&&confirm('¿Eliminar esta actividad?')){await eliminarEvento(id);$('#dlg').close()}}; $('#form').onsubmit=async e=>{e.preventDefault();let ac=val('act'),name=ac,icon=$(`#act [data-v="${ac}"]`).dataset.i,bw='';if(ac==='Otra'){name=$('#legend').value.trim();if(!name)return alert('Escribe la leyenda')}if(ac==='Cumpleaños'){bw=$('#bwho').value.trim();if(!bw)return alert('Indica de quién es');name='Cumpleaños '+bw}let o={id:$('#eid').value||null,date:$('#date').value,until:$('#until').value,person:val('person'),name,icon,start:$('#start').value,end:$('#end').value,takes:val('takes'),picks:val('picks'),repeat:val('repeat'),status:val('status'),birthdayWho:bw};if(await guardarEvento(o))$('#dlg').close()}; $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').classList.add('hidden');const {error}=await supabaseClient.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginError').textContent=error.message;$('#loginError').classList.remove('hidden');return}$('#loginDlg').close();await iniciarApp()}; async function iniciarApp(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('#loginDlg').showModal();return}await cargarEventos();if(!channel){channel=supabaseClient.channel('eventos-familia').on('postgres_changes',{event:'*',schema:'public',table:'eventos'},()=>cargarEventos()).subscribe()}} supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')$('#loginDlg').showModal()}); iniciarApp(); </script> </body> </html>
